services:
  ashorin:
    build:
      context: .
      dockerfile: Dockerfile
    image: orinihsaq/ashorin:latest
    container_name: ashorin
    restart: unless-stopped

    ports:
      - "8080:8080"

    # Run as root with tightly scoped Linux capabilities.
    # All capabilities are dropped first; only the three needed for NAS bind-mount
    # access are added back:
    #   DAC_OVERRIDE  — bypass filesystem permission checks on bind-mounted NAS dirs
    #   CHOWN         — allow chown on files created during download/extraction
    #   FOWNER        — allow chmod on files owned by other UIDs (pre-existing NAS files)
    user: "0:0"

    # Use Docker's default bridge network.
    # UGREEN UGOS (and most NAS operating systems) only route WAN traffic through
    # the built-in bridge network. Compose normally creates an isolated project
    # network that has no outbound internet access on UGOS — this fixes TMDB,
    # yt-dlp, and any other external connectivity.
    network_mode: "bridge"

    # Explicit public DNS resolvers ensure name resolution works even when the NAS
    # DNS daemon is not reachable from inside the Docker bridge subnet.
    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      - type: bind
        source: /volume1/docker/ashorin/data
        target: /data
        read_only: false

      - type: bind
        source: /volume1/docker/ashorin/media
        target: /media
        read_only: false

    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      MAX_CONCURRENT_DOWNLOADS: "2"
      DOWNLOAD_RETENTION_ENABLED: "false"
      DOWNLOAD_RETENTION_DAYS: "7"
      DOWNLOAD_RETENTION: "0"
      TEMP_RETENTION: "3600"
      YTDLP_AUTO_UPDATE: "true"
      YTDLP_UPDATE_INTERVAL: "86400"
      YTDLP_UPDATE_CHANNEL: "stable"
      MAX_DOWNLOAD_SIZE: "10G"
      DOWNLOAD_TIMEOUT: "3600"
      LOG_LEVEL: "INFO"
      MEDIA_DISCOVERY_ENABLED: "false"
      TMDB_ENABLED: "true"
      TMDB_API_KEY: ""

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
